<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Oracle · چارت تولد حرفه‌ای</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: #07080f;
            color: #e8e4f0;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }

        /* ===== Animated Space Background ===== */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== Glassmorphism Container ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== Header ===== */
        .main-header {
            text-align: center;
            padding: 30px 0 20px;
            background: rgba(10, 12, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .main-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 50% 30%, rgba(100, 140, 255, 0.04), transparent 60%);
            pointer-events: none;
        }
        .main-header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .main-header .logo-icon {
            font-size: 42px;
            display: inline-block;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(140, 180, 255, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(140, 180, 255, 0.4));
            }
        }
        .main-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            font-weight: 700;
            background: linear-gradient(135deg, #d9ceff, #8bbdff, #7c83ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.06em;
        }
        .main-header .sub {
            color: #8a82a0;
            font-size: 15px;
            margin-top: 4px;
            letter-spacing: 0.1em;
        }
        .header-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .header-actions .btn-action {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #b8aec8;
            font-size: 12px;
            cursor: pointer;
            transition: 0.25s ease;
            font-family: inherit;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions .btn-action:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(140, 180, 255, 0.15);
            color: #fff;
        }
        .header-actions .btn-action.primary {
            background: linear-gradient(135deg, rgba(108, 140, 255, 0.2), rgba(156, 121, 255, 0.2));
            border-color: rgba(108, 140, 255, 0.2);
            color: #b0caff;
        }
        .header-actions .btn-action.primary:hover {
            background: linear-gradient(135deg, rgba(108, 140, 255, 0.3), rgba(156, 121, 255, 0.3));
            border-color: rgba(108, 140, 255, 0.35);
        }

        /* ===== Form ===== */
        .form-card {
            background: rgba(18, 20, 45, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 30px 28px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            transition: 0.3s ease;
        }
        .form-card:hover {
            border-color: rgba(140, 180, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #e6dcff;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-title span {
            background: rgba(140, 180, 255, 0.12);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #b0caff;
            font-weight: 400;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #b8aec8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(180, 165, 255, 0.12);
            background: rgba(6, 7, 24, 0.6);
            color: #f0ecff;
            font-size: 14px;
            font-family: inherit;
            transition: 0.25s ease;
            width: 100%;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: rgba(140, 180, 255, 0.35);
            box-shadow: 0 0 25px rgba(100, 140, 255, 0.08);
        }
        .form-group .hint {
            font-size: 11px;
            color: #5a526e;
            margin-top: 2px;
        }

        /* ===== City Search ===== */
        .city-search {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .city-search input {
            flex: 1;
        }
        .city-search button {
            padding: 12px 22px;
            border-radius: 14px;
            border: 1px solid rgba(100, 140, 255, 0.2);
            background: rgba(100, 140, 255, 0.1);
            color: #b0caff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
            white-space: nowrap;
            font-family: inherit;
        }
        .city-search button:hover {
            background: rgba(100, 140, 255, 0.2);
            border-color: rgba(100, 140, 255, 0.35);
            box-shadow: 0 0 30px rgba(100, 140, 255, 0.08);
        }

        /* ===== Submit Button ===== */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c8cff, #9c79ff);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: inherit;
            margin-top: 10px;
            letter-spacing: 0.03em;
            box-shadow: 0 6px 30px rgba(100, 140, 255, 0.15);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(100, 140, 255, 0.25);
        }

        /* ===== Status ===== */
        #status {
            text-align: center;
            padding: 12px;
            margin-top: 14px;
            border-radius: 14px;
            font-size: 14px;
            display: none;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== Results ===== */
        #result {
            margin-top: 30px;
            display: none;
        }

        /* ===== Grid Cards ===== */
        .section-card {
            background: rgba(18, 20, 45, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px 26px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
            position: relative;
            overflow: hidden;
        }
        .section-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .section-card.appearing::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            background: radial-gradient(ellipse at 50% 0%, rgba(140, 180, 255, 0.06), transparent 70%);
            pointer-events: none;
            animation: glowFade 1.2s ease forwards;
        }
        @keyframes glowFade {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #e6dcff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .section-title .emoji-big {
            font-size: 26px;
        }
        .section-title .badge-count {
            background: rgba(140, 180, 255, 0.1);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #b0caff;
            font-weight: 400;
        }

        /* ===== Grid System ===== */
        .grid-masonry {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }
        .grid-masonry-2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
        }
        .grid-masonry-3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .grid-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .grid-flex .aspect-item {
            flex: 1 1 auto;
            min-width: 120px;
            max-width: 100%;
        }

        .grid-item {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.25s ease;
            opacity: 0;
            transform: translateY(8px) scale(0.97);
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .grid-item.appearing {
            animation: itemGlow 0.8s ease forwards;
        }
        @keyframes itemGlow {
            0% {
                filter: drop-shadow(0 0 8px rgba(140, 180, 255, 0.15));
            }
            100% {
                filter: drop-shadow(0 0 0 transparent);
            }
        }
        .grid-item .p-name {
            font-weight: 600;
            color: #f2d275;
        }
        .grid-item .p-detail {
            color: #b0caff;
            font-size: 13px;
            direction: ltr;
            text-align: left;
        }
        .grid-item .p-detail .badge-house {
            background: rgba(140, 180, 255, 0.08);
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #8a82a0;
            margin-right: 4px;
        }

        /* ===== Elements Grid ===== */
        .element-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: translateY(8px) scale(0.97);
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }
        .element-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .element-item.appearing {
            animation: itemGlow 0.8s ease forwards;
        }
        .element-item .el-value {
            font-size: 24px;
            font-weight: 700;
        }
        .element-item .el-label {
            font-size: 13px;
            color: #8a82a0;
            margin-top: 2px;
        }
        .element-item .el-desc {
            font-size: 11px;
            color: #6a607a;
            margin-top: 4px;
        }

        /* ===== Moon Phase ===== */
        .moon-phase-box {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            will-change: opacity, transform;
        }
        .moon-phase-box.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .moon-phase-box .mp-emoji {
            font-size: 40px;
        }
        .moon-phase-box .mp-info {
            flex: 1;
        }
        .moon-phase-box .mp-name {
            font-size: 18px;
            font-weight: 600;
            color: #e6dcff;
        }
        .moon-phase-box .mp-desc {
            font-size: 13px;
            color: #8a82a0;
        }

        /* ===== Vedic Items ===== */
        .vedic-item {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: translateY(8px) scale(0.97);
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }
        .vedic-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .vedic-item.appearing {
            animation: itemGlow 0.8s ease forwards;
        }
        .vedic-item .planet-name {
            color: #f2d275;
            font-weight: 600;
            font-size: 15px;
        }
        .vedic-item .vedic-detail {
            color: #b0caff;
            font-size: 13px;
            display: block;
            padding-right: 20px;
            margin-top: 3px;
        }
        .nakshatra-box {
            background: rgba(100, 200, 255, 0.04);
            border: 1px solid rgba(100, 200, 255, 0.08);
            border-radius: 10px;
            padding: 6px 14px;
            margin-top: 4px;
            font-size: 12px;
            color: #b8d4e8;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .nature-benefic {
            color: #5fbf5f;
        }
        .nature-malefic {
            color: #e87474;
        }
        .nature-neutral {
            color: #b0caff;
        }

        /* ===== Aspect item ===== */
        .aspect-item {
            background: rgba(140, 180, 255, 0.04);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(140, 180, 255, 0.06);
            transition: 0.25s ease;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.5s ease, transform 0.5s ease, background 0.25s;
            will-change: opacity, transform;
        }
        .aspect-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .aspect-item:hover {
            background: rgba(140, 180, 255, 0.08);
            border-color: rgba(140, 180, 255, 0.12);
        }

        /* ===== DeepSeek Analysis ===== */
        .analysis-box {
            background: rgba(10, 12, 30, 0.5);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            line-height: 2;
            color: #d4cce8;
            font-size: 14px;
            min-height: 80px;
        }
        .analysis-box h2,
        .analysis-box h3 {
            color: #e6dcff;
            margin-top: 16px;
            margin-bottom: 8px;
        }
        .analysis-box ul {
            padding-right: 20px;
        }
        .analysis-box hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin: 12px 0;
        }

        /* ===== Spinner ===== */
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #8bbdff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Footer ===== */
        .footer-premium {
            text-align: center;
            padding: 30px 0 10px;
            color: #5a526e;
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 30px;
        }
        .footer-premium a {
            color: #8a82a0;
            text-decoration: none;
            transition: 0.25s;
        }
        .footer-premium a:hover {
            color: #b0caff;
        }

        /* ===== YOGA ENGINE OVERLAY ===== */
        .yoga-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .yoga-overlay.active {
            display: flex;
            pointer-events: auto;
        }
        .yoga-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(140,180,255,0.25), rgba(100,80,200,0.08));
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 60px rgba(140,180,255,0.15);
            transition: transform 4s ease-in-out, opacity 4s ease-in-out;
            transform: scale(1);
            opacity: 0.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            font-weight: 300;
            text-shadow: 0 0 30px rgba(140,180,255,0.4);
            user-select: none;
        }
        .yoga-circle.inhale {
            transform: scale(1.9);
            opacity: 0.9;
            border-color: rgba(180,220,255,0.25);
            box-shadow: 0 0 120px rgba(140,180,255,0.3);
        }
        .yoga-circle.exhale {
            transform: scale(1);
            opacity: 0.3;
            border-color: rgba(255,255,255,0.04);
            box-shadow: 0 0 30px rgba(140,180,255,0.05);
        }
        .yoga-text {
            position: absolute;
            bottom: 22%;
            color: #b0caff;
            font-size: 15px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            padding: 10px 32px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.04);
            transition: opacity 0.8s ease;
            font-weight: 400;
        }
        .yoga-controls {
            position: absolute;
            bottom: 8%;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }
        .yoga-controls button,
        .yoga-controls input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e8e4f0;
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: 0.3s;
        }
        .yoga-controls button:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(140,180,255,0.2);
        }
        .yoga-controls input[type="range"] {
            width: 120px;
            background: transparent;
            accent-color: #8bbdff;
        }
        .yoga-controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #b0caff;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .grid-masonry {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .grid-masonry-2 {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
            .grid-masonry-3 {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .city-search {
                flex-wrap: wrap;
            }
            .city-search button {
                width: 100%;
            }
            .main-header h1 {
                font-size: 28px;
            }
            .header-actions .btn-action {
                font-size: 11px;
                padding: 4px 12px;
            }
            .moon-phase-box {
                flex-direction: column;
                text-align: center;
            }
            .yoga-circle {
                width: 100px;
                height: 100px;
                font-size: 18px;
            }
            .yoga-controls {
                gap: 10px;
            }
            .yoga-controls button,
            .yoga-controls input {
                padding: 6px 14px;
                font-size: 12px;
            }
        }
        @media (max-width: 500px) {
            .grid-masonry {
                grid-template-columns: 1fr 1fr;
            }
            .grid-masonry-2 {
                grid-template-columns: 1fr 1fr;
            }
            .grid-masonry-3 {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0d1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3550;
            border-radius: 10px;
        }

        (function initBackground() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const stars = Array.from({ length: 260 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.8 + 0.3,
                a: Math.random() * 0.6 + 0.2,
                v: Math.random() * 0.008 + 0.004,
                phase: Math.random() * Math.PI * 2
            }));

            const circles = Array.from({ length: 4 }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 120 + 60,
                dx: (Math.random() - 0.5) * 0.3,
                dy: (Math.random() - 0.5) * 0.3,
                color: `hsla(${Math.random() * 60 + 220}, 70%, 50%, 0.03)`
            }));

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (const s of stars) {
                    s.phase += s.v;
                    const alpha = s.a * (0.6 + 0.4 * Math.sin(s.phase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(220, 230, 255, ${alpha})`;
                    ctx.fill();
                }
                for (const c of circles) {
                    c.x += c.dx;
                    c.y += c.dy;
                    if (c.x < -c.r || c.x > w + c.r) c.dx *= -1;
                    if (c.y < -c.r || c.y > h + c.r) c.dy *= -1;
                    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
                    grad.addColorStop(0, c.color);
                    grad.addColorStop(1, 'transparent');
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);

                    body: JSON.stringify(payloadData)
                });
                if (!respData.ok) { const err = await respData.json(); throw new Error(err.message || 'خطا در دریافت داده'); }
                const data = await respData.json();
                if (data.status !== 'OK') throw new Error(data.message || 'خطای ناشناخته');
                currentData = data;

                // 2. دریافت context
                const ctxResp = await fetch('/api/v5/context/birth-chart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadData)
                });
                if (ctxResp.ok) {
                    const ctxData = await ctxResp.json();
                    currentContext = ctxData.context || '';
                } else {
                    currentContext = null;
                }

                // 3. دریافت SVG
                let svgText = '';
                try {
                    const respSvg = await fetch('/api/v5/chart/svg-from-subject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payloadData)   // دقیقاً همان payloadData
});
                    if (respSvg.ok) {
                        svgText = await respSvg.text();
                    } else {
                        svgText = '';
                    }
                } catch (svgErr) {
                    console.warn('خطا در دریافت SVG:', svgErr);
                    svgText = '';
                }

                // 4. نمایش
                await displayResult(data, currentContext, svgText);
                statusDiv.innerHTML = '✅ تحلیل کامل شد!';
                statusDiv.style.color = '#5fbf5f';

            } catch (err) {
                statusDiv.innerHTML = `⚠️ خطا: ${err.message}`;
                statusDiv.style.color = '#e87474';
                console.error(err);
            }
        });

        // ================================================================
        //   DISPLAY RESULT (FULL)
        // ================================================================
        async function displayResult(data, context, svgContent) {
            const resultDiv = document.getElementById('result');
            const chart = data.chart_data;
            const subject = chart.subject;
            const vedic = data.vedic_interpretations || {};

            let html = '';

            // ---- SVG (اصلاح شده با img برای ریسپانسیو بودن) ----
            if (svgContent && svgContent.trim()) {
                html += `<div class="section-card" id="section-svg">
                    <div class="section-title"><span class="emoji-big">🖼️</span> چارت نجومی</div>
                    <div style="text-align:center; overflow:auto; max-width:100%;">
                        <img src="data:image/svg+xml;utf8,${encodeURIComponent(svgContent)}" style="max-width:100%; height:auto; display:block; margin:0 auto;" />
                    </div>
                </div>`;
            }

            // ---- Planets ----
            html += `<div class="section-card" id="section-planets"><div class="section-title"><span class="emoji-big">🪐</span> موقعیت سیارات <span class="badge-count">${Object.keys(subject).filter(k => ['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'].includes(k)).length}</span></div><div class="grid-masonry" id="planets-grid">`;
            const planetKeys = ['sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto'];
            planetKeys.forEach(key => {
                const obj = subject[key];
                if (obj && obj.name) {
                    const nameFa = translate(obj.name);
                    const signFa = translate(obj.sign);
                    const emoji = signEmoji(obj.sign);
                    const pos = obj.position ? obj.position.toFixed(1) : '?';
                    const house = translate(obj.house);
                    html += `<div class="grid-item stagger-item">${emoji} <span class="p-name">${nameFa}</span><span class="p-detail">${signFa} ${pos}° <span class="badge-house">خانه ${house}</span></span></div>`;
                }
            });
            html += `</div></div>`;

            // ---- Angles ----
            html += `<div class="section-card" id="section-angles"><div class="section-title"><span class="emoji-big">🌅</span> نقاط حساس</div><div class="grid-masonry-2" id="angles-grid">`;
            const angles = ['ascendant', 'medium_coeli', 'descendant', 'imum_coeli'];
            angles.forEach(key => {
                const obj = subject[key];
                if (obj && obj.name) {
                    const nameFa = translate(obj.name);
                    const signFa = translate(obj.sign);
                    const emoji = signEmoji(obj.sign);
                    const pos = obj.position ? obj.position.toFixed(1) : '?';
                    html += `<div class="grid-item stagger-item">${emoji} <span class="p-name">${nameFa}</span><span class="p-detail">${signFa} ${pos}°</span></div>`;
                }
            });
            html += `</div></div>`;

            // ---- Aspects ----
            if (chart.aspects && chart.aspects.length > 0) {
                html += `<div class="section-card" id="section-aspects"><div class="section-title"><span class="emoji-big">⚡</span> جنبه‌ها <span class="badge-count">${chart.aspects.length}</span></div><div class="grid-flex" id="aspects-container">`;
                chart.aspects.forEach(a => {
                    const p1 = translate(a.p1_name);
                    const p2 = translate(a.p2_name);
                    const aspect = translate(a.aspect);
                    const orb = a.orbit ? a.orbit.toFixed(1) : '?';
                    html += `<span class="aspect-item stagger-item">${p1} ${aspect} ${p2} (${orb}°)</span>`;
                });
                html += `</div></div>`;
            }

            // ---- Elements ----
            if (chart.element_distribution) {
                const el = chart.element_distribution;
                html += `<div class="section-card" id="section-elements"><div class="section-title"><span class="emoji-big">🔥</span> توزیع عناصر</div><div class="grid-masonry-3" id="elements-grid">`;
                const items = [
                    { key: 'fire', p: el.fire_percentage, color: '#ff6600' },
                    { key: 'earth', p: el.earth_percentage, color: '#6a2d04' },
                    { key: 'air', p: el.air_percentage, color: '#6f76d1' },
                    { key: 'water', p: el.water_percentage, color: '#630e73' }
                ];
                items.forEach(item => {
                    const info = getElementInterpretation(item.key, item.p || 0);
                    html += `<div class="element-item stagger-item">
                        <div class="el-value" style="color:${item.color};">${item.p || 0}%</div>
                        <div class="el-label" style="color:${item.color};">${translate(item.key)}</div>
                        <div class="el-desc">${info.split('—')[1] || ''}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }

            // ---- Moon Phase ----
            if (subject.lunar_phase) {
                const lp = subject.lunar_phase;
                const phaseName = translate(lp.moon_phase_name) || 'نامشخص';
                const phaseDesc = getMoonPhaseInterpretation(lp.moon_phase_name);
                html += `<div class="section-card" id="section-moon"><div class="section-title"><span class="emoji-big">🌙</span> فاز ماه</div>
                    <div class="moon-phase-box stagger-item">
                        <div class="mp-emoji">${lp.moon_emoji || '🌙'}</div>
                        <div class="mp-info">
                            <div class="mp-name">${phaseName}</div>
                            <div class="mp-desc">${phaseDesc}</div>
                        </div>
                        <div class="mp-degree">مرحله ${lp.moon_phase || 0}</div>
                    </div>
                </div>`;
            }

            // ---- Vedic ----
            if (Object.keys(vedic).length > 0) {
                html += `<div class="section-card" id="section-vedic"><div class="section-title"><span class="emoji-big">📜</span> تفسیر ودیک (Vedic) <span class="badge-count">${Object.keys(vedic).length}</span></div><div class="grid-masonry-3" id="vedic-container">`;
                const planetOrder = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Rahu', 'Ketu'];
                const sorted = Object.keys(vedic).sort((a, b) => {
                    const ia = planetOrder.indexOf(a);
                    const ib = planetOrder.indexOf(b);
                    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                });
                for (const planet of sorted) {
                    const interp = vedic[planet];
                    if (!interp) continue;
                    const planetFa = translate(planet);
                    const signFa = translate(interp.sign) || '';
                    const house = interp.house || '?';
                    const lordship = interp.lordship || [];
                    const fn = interp.functional_nature || {};
                    const nature = fn.nature || 'Neutral';
                    const type = fn.type || '';
                    const drishti = interp.drishti || [];
                    const nakshatra = interp.nakshatra;
                    const strength = interp.planetary_strength || {};

                    const simpleNature = simpleFunctionalNature(nature, type);
                    const simpleStrength = strength.status ? simplePlanetaryStrength(strength.status) : '';

                    html += `<div class="vedic-item stagger-item">
                        <span class="planet-name">${planetFa}</span>
                        <span style="color:#b0caff;"> در برج ${signFa} · خانه ${house}</span>
                        ${lordship.length ? `<span class="badge" style="background:rgba(255,200,50,0.08);padding:1px 12px;border-radius:20px;font-size:11px;color:#f2d275;margin-right:6px;">صاحب خانه‌های ${lordship.join('، ')}</span>` : ''}
                        <span class="vedic-detail ${getNatureClass(nature)}">⭐ ${simpleNature}</span>
                        ${drishti.length ? `<span class="vedic-detail">👁️ نگاه به خانه‌های ${drishti.join('، ')}</span>` : ''}
                        ${simpleStrength ? `<span class="vedic-detail" style="color:#f2d275;">💪 ${simpleStrength}</span>` : ''}
                        ${nakshatra ? `<div class="nakshatra-box"><span>⭐ <strong>ناکشاترا:</strong> ${nakshatra.name_fa || nakshatra.name}</span><span>🌙 حاکم: ${translate(nakshatra.lord) || nakshatra.lord}</span>${nakshatra.interpretation ? `<span style="color:#d4c8a0;">📖 ${nakshatra.interpretation}</span>` : ''}</div>` : ''}
                    </div>`;
                }
                html += `</div></div>`;
            }

            // ---- DeepSeek ----
            if (context) {
                html += `<div class="section-card" id="section-deepseek"><div class="section-title"><span class="emoji-big">🧠</span> تحلیل تکمیلی DeepSeek</div>
                    <div class="analysis-box" id="deepseek-box">
                        <span style="color:#5a526e;">⏳ در حال دریافت تحلیل...</span>
                    </div>
                </div>`;
                resultDiv.innerHTML = html;
                await showStaggered();
                try {
                    const analysis = await getDeepSeekAnalysisFromBackend(context, vedic);
                    document.getElementById('deepseek-box').innerHTML = analysis;
                } catch (err) {
                    document.getElementById('deepseek-box').innerHTML =
                        `<div style="color:#e87474;">⚠️ خطا: ${err.message}</div>`;
                }
            } else {
                html += `<div class="section-card" id="section-deepseek"><div class="section-title"><span class="emoji-big">🧠</span> تحلیل تکمیلی DeepSeek</div>
                    <div class="analysis-box" style="color:#5a526e;">⚠️ متن context در دسترس نیست.</div>
                </div>`;
                resultDiv.innerHTML = html;
                await showStaggered();
            }

            async function showStaggered() {
                const sections = resultDiv.querySelectorAll('.section-card');
                for (let i = 0; i < sections.length; i++) {
                    const section = sections[i];
                    section.classList.add('visible');
                    section.classList.add('appearing');
                    const items = section.querySelectorAll('.stagger-item');
                    if (items.length) {
                        for (let j = 0; j < items.length; j++) {
                            await sleep(180);
                            items[j].classList.add('visible');
                            items[j].classList.add('appearing');
                        }
                    } else {
                        await sleep(400);
                    }
                    if (i < sections.length - 1) {
                        await sleep(900);
                    }
                }
            }
        }

        // ================================================================
        //   DEEPSEEK FROM BACKEND
        // ================================================================
        async function getDeepSeekAnalysisFromBackend(contextText, vedicData) {
            let vedicSummary = "";
            if (vedicData && Object.keys(vedicData).length > 0) {
                vedicSummary = "\n\n**📜 اطلاعات تکمیلی ودیک (Vedic):**\n";
                const planetOrder = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Rahu', 'Ketu'];
                const sorted = Object.keys(vedicData).sort((a, b) => {
                    const ia = planetOrder.indexOf(a);
                    const ib = planetOrder.indexOf(b);
                    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                });
                for (const planet of sorted) {
                    const d = vedicData[planet];
                    if (!d) continue;
                    const pf = translate(planet);
                    const sf = translate(d.sign) || '';
                    const hs = d.house || '?';
                    const ls = d.lordship || [];
                    const fn = d.functional_nature || {};
                    const nature = fn.nature || 'Neutral';
                    const st = d.planetary_strength || {};
                    const nk = d.nakshatra || {};
                    vedicSummary += `\n- **${pf}** در برج ${sf}، خانه ${hs}`;
                    if (ls.length) vedicSummary += `\n  🏠 صاحب خانه‌های ${ls.join('، ')}`;
                    vedicSummary += `\n  ⭐ طبیعت: ${nature}`;
                    if (st.status) vedicSummary += `\n  💪 قدرت: ${st.status}`;
                    if (nk.name_fa) vedicSummary += `\n  🌙 ناکشاترا: ${nk.name_fa} — ${nk.interpretation || ''}`;
                }
            }

            try {
                const resp = await fetch('/api/v5/deepseek-analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ context: contextText, vedic_summary: vedicSummary })
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || 'خطا در دریافت تحلیل');
                }
                const data = await resp.json();
                return data.analysis;
            } catch (error) {
                console.error('DeepSeek Error:', error);
                return `❌ خطا در ارتباط با DeepSeek: ${error.message}`;
            }
        }

        // ================================================================
        //   YOGA ENGINE
        // ================================================================
        (function initYoga() {
            const overlay = document.getElementById('yogaOverlay');
            const circle = document.getElementById('yogaCircle');
            const phaseText = document.getElementById('yogaPhase');
            const textDisplay = document.getElementById('yogaText');
            const toggleBtn = document.getElementById('yogaToggle');
            const speedSlider = document.getElementById('yogaSpeed');
            const closeBtn = document.getElementById('yogaClose');

            let isRunning = false;
            let inhaleDuration = 4000;
            let exhaleDuration = 4000;
            let animFrame = null;
            let startTime = 0;
            let currentPhase = 'inhale';
            let paused = false;

            const headerActions = document.querySelector('.header-actions');
            const yogaBtn = document.createElement('button');
            yogaBtn.className = 'btn-action primary';
            yogaBtn.innerHTML = '🧘 Yoga Engine';
            yogaBtn.style.marginRight = 'auto';
            yogaBtn.addEventListener('click', () => {
                if (!overlay.classList.contains('active')) {
                    overlay.classList.add('active');
                    startYoga();
                } else {
                    stopYoga();
                    overlay.classList.remove('active');
                }
            });
            headerActions.prepend(yogaBtn);

            function startYoga() {
                if (isRunning) return;
                isRunning = true;
                paused = false;
                currentPhase = 'inhale';
                circle.className = 'yoga-circle';
                textDisplay.textContent = 'دم بکش...';
                phaseText.textContent = '🌬️';
                startTime = performance.now();
                toggleBtn.textContent = '⏸️ توقف';
                if (animFrame) cancelAnimationFrame(animFrame);
                updateYoga();
            }

            function stopYoga() {
                isRunning = false;
                if (animFrame) {
                    cancelAnimationFrame(animFrame);
                    animFrame = null;
                }
                circle.className = 'yoga-circle';
                textDisplay.textContent = '';
                phaseText.textContent = '⏸️';
            }

            function updateYoga() {
                if (!isRunning || paused) {
                    animFrame = requestAnimationFrame(updateYoga);
                    return;
                }

                const now = performance.now();
                const elapsed = now - startTime;
                const totalDuration = currentPhase === 'inhale' ? inhaleDuration : exhaleDuration;
                const progress = Math.min(elapsed / totalDuration, 1);
                const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                if (currentPhase === 'inhale') {
                    const scale = 1 + ease * 0.9;
                    const opacity = 0.3 + ease * 0.6;
                    circle.style.transform = `scale(${scale})`;
                    circle.style.opacity = opacity;
                    circle.className = 'yoga-circle inhale';
                    textDisplay.textContent = 'دم بکش...';
                    phaseText.textContent = '🌬️';
                } else {
                    const scale = 1.9 - ease * 0.9;
                    const opacity = 0.9 - ease * 0.6;
                    circle.style.transform = `scale(${scale})`;
                    circle.style.opacity = opacity;
                    circle.className = 'yoga-circle exhale';
                    textDisplay.textContent = 'بازدم...';
                    phaseText.textContent = '🌊';
                }

                if (progress >= 1) {
                    currentPhase = currentPhase === 'inhale' ? 'exhale' : 'inhale';
                    startTime = performance.now();
                }

                animFrame = requestAnimationFrame(updateYoga);
            }

            toggleBtn.addEventListener('click', () => {
                if (!isRunning) return;
                paused = !paused;
                toggleBtn.textContent = paused ? '▶️ ادامه' : '⏸️ توقف';
                if (!paused) {
                    startTime = performance.now();
                }
            });

            speedSlider.addEventListener('input', () => {
                const val = parseFloat(speedSlider.value);
                inhaleDuration = val * 1000;
                exhaleDuration = val * 1000;
                if (isRunning) {
                    startTime = performance.now();
                }
            });

            closeBtn.addEventListener('click', () => {
                stopYoga();
                overlay.classList.remove('active');
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    stopYoga();
                    overlay.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'y' || e.key === 'Y') {
                    if (!overlay.classList.contains('active')) {
                        overlay.classList.add('active');
                        startYoga();
                    } else {
                        stopYoga();
                        overlay.classList.remove('active');
                    }
                }
            });
        })();

        // ================================================================
        //   INIT
        // ================================================================
        window.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const y = today.getFullYear() - 20;
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            document.getElementById('birthDate').value = `${y}-${m}-${d}`;
        });
    </script>
