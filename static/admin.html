<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت — Cosmic Oracle</title>
<link rel="stylesheet" href="static/audio-player.css">
<link rel="icon" type="image/svg+xml" href="static/images/ui/logo.svg">
<link rel="stylesheet" href="static/yoga-v3.css?v=7">
<style>
    :root {
        color-scheme: dark;
        --lapis-950: #070c1f;
        --lapis-900: #0c1430;
        --lapis-850: #101a3d;
        --lapis-800: #16224d;
        --lapis-700: #22305f;
        --gold-200: #f3e5b8;
        --gold-300: #ecd9a0;
        --gold-400: #ddc070;
        --gold-500: #c9a227;
        --gold-600: #a8812a;
        --ink: #ece6d6;
        --ink-dim: #aab2cd;
        --star: #9fd4e0;
        --line: rgba(221, 192, 112, 0.16);
        --line-strong: rgba(221, 192, 112, 0.42);
        --panel: rgba(16, 26, 61, 0.72);
        --shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.85);
        --sidebar-w: 280px;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2140 0%, #0b0e1a 60%);
        color: var(--ink); font-family: Vazirmatn, Tahoma, sans-serif;
    }
    a { color: var(--gold-400); text-decoration: none; }
    a:hover { color: var(--gold-200); }

    /* ─── Admin Panel ─── */
    .admin-page { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
    .admin-page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
    .admin-page-title { font-family: 'Cinzel', serif; font-size: 26px; color: var(--gold-200); margin: 0; }
    .admin-page-sub { color: var(--ink-dim); font-size: 13px; margin-bottom: 28px; }
    .admin-back { font-size: 13px; }

    /* Stats row */
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .admin-stat-card {
        background: rgba(18, 22, 46, 0.85);
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        padding: 20px 16px;
        text-align: center;
        transition: transform 0.2s, box-shadow 0.3s;
    }
    .admin-stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(201,162,39,0.1); }
    .admin-stat-icon { font-size: 28px; margin-bottom: 8px; }
    .admin-stat-value { font-family: 'Cinzel', serif; font-size: 30px; color: var(--gold-200); font-weight: 700; }
    .admin-stat-label { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }

    /* Tabs */
    .admin-tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line-strong); padding-bottom: 10px; flex-wrap: wrap; }
    .admin-tab {
        background: transparent; border: none; color: var(--ink-dim); font-family: 'Vazirmatn', sans-serif;
        font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 10px 10px 0 0;
        cursor: pointer; transition: all 0.2s;
    }
    .admin-tab:hover { color: var(--gold-300); background: rgba(221,192,112,0.06); }
    .admin-tab.active { color: var(--gold-200); background: rgba(221,192,112,0.12); border-bottom: 2px solid var(--gold-400); }

    /* Toolbar */
    .admin-toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .admin-search {
        flex: 1; padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line-strong);
        background: rgba(7, 12, 31, 0.6); color: var(--ink); font-family: 'Vazirmatn', sans-serif;
        font-size: 13px; outline: none; direction: rtl;
    }
    .admin-search:focus { border-color: var(--gold-400); }

    /* Buttons */
    .admin-btn {
        padding: 8px 18px; border-radius: 10px; border: 1px solid var(--line-strong);
        background: rgba(18, 22, 46, 0.85); color: var(--ink-dim); font-family: 'Vazirmatn', sans-serif;
        font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .admin-btn:hover { border-color: var(--gold-400); color: var(--gold-200); }
    .admin-btn-primary { background: rgba(201,162,39,0.15); border-color: var(--gold-400); color: var(--gold-200); }
    .admin-btn-primary:hover { background: rgba(201,162,39,0.25); }
    .admin-icon-btn {
        background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px;
        border-radius: 6px; transition: background 0.2s;
    }
    .admin-icon-btn:hover { background: rgba(221,192,112,0.1); }
    .admin-icon-btn-danger:hover { background: rgba(255,118,117,0.15); }

    /* Table */
    .admin-table-wrap { overflow-x: auto; }
    .admin-table {
        width: 100%; border-collapse: collapse; font-size: 13px;
        font-family: 'Vazirmatn', sans-serif;
    }
    .admin-table th {
        text-align: right; padding: 10px 12px; color: var(--gold-300);
        border-bottom: 2px solid var(--line-strong); font-weight: 700; font-size: 12px;
        white-space: nowrap;
    }
    .admin-table td {
        padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04);
        color: var(--ink); vertical-align: middle;
    }
    .admin-table tr:hover td { background: rgba(221,192,112,0.03); }

    /* Plans */
    .admin-plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .admin-plan-card {
        background: rgba(18, 22, 46, 0.85); border: 1px solid var(--line-strong);
        border-radius: 14px; padding: 24px 18px; transition: transform 0.2s;
    }
    .admin-plan-card:hover { transform: translateY(-2px); }
    .admin-plan-badge { display: inline-block; padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
    .admin-plan-price { font-family: 'Cinzel', serif; font-size: 20px; color: var(--gold-200); margin-bottom: 6px; }
    .admin-plan-limit { font-size: 11px; color: var(--ink-dim); margin-bottom: 14px; }
    .admin-plan-features { list-style: none; padding: 0; margin: 0; }
    .admin-plan-features li { font-size: 12px; color: var(--ink-dim); padding: 3px 0; }

    /* Settings */
    .admin-settings-form { max-width: 500px; }
    .admin-setting-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .admin-setting-row label { font-size: 13px; color: var(--ink); }
    .admin-input {
        padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line-strong);
        background: rgba(7, 12, 31, 0.6); color: var(--ink); font-family: 'Vazirmatn', sans-serif;
        font-size: 13px; outline: none; width: 200px; direction: rtl;
    }
    .admin-input:focus { border-color: var(--gold-400); }
    select.admin-input { width: 216px; }

    /* Toggle switch */
    .admin-toggle { position: relative; display: inline-block; width: 42px; height: 22px; cursor: pointer; }
    .admin-toggle input { opacity: 0; width: 0; height: 0; }
    .admin-toggle-slider {
        position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 22px; transition: 0.3s;
    }
    .admin-toggle-slider::before {
        content: '';
        position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
        background: var(--ink-dim); border-radius: 50%; transition: 0.3s;
    }
    .admin-toggle input:checked + .admin-toggle-slider { background: rgba(201,162,39,0.4); }
    .admin-toggle input:checked + .admin-toggle-slider::before { transform: translateX(20px); background: var(--gold-200); }

    /* Modal */
    .admin-modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(4px);
    }
    .admin-modal-overlay.visible { opacity: 1; }
    .admin-modal {
        background: #12162e; border: 1px solid var(--line-strong); border-radius: 16px;
        width: 420px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
    }
    .admin-modal-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 16px 20px; border-bottom: 1px solid var(--line-strong);
    }
    .admin-modal-header h3 { font-family: 'Vazirmatn', sans-serif; font-size: 15px; color: var(--gold-200); margin: 0; }
    .admin-modal-close {
        background: none; border: none; color: var(--ink-dim); font-size: 18px;
        cursor: pointer; padding: 4px 8px; border-radius: 6px;
    }
    .admin-modal-close:hover { background: rgba(255,118,117,0.15); color: #ff7675; }
    .admin-modal-body { padding: 20px; }
    .admin-form-row { margin-bottom: 14px; }
    .admin-form-row label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 4px; }
    .admin-form-row .admin-input { width: 100%; box-sizing: border-box; }
    .admin-modal-footer {
        display: flex; justify-content: flex-end; gap: 8px;
        padding: 14px 20px; border-top: 1px solid var(--line-strong);
    }

    /* Toast */
    .admin-toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: rgba(18, 22, 46, 0.95); border: 1px solid var(--gold-400);
        color: var(--gold-200); padding: 10px 24px; border-radius: 12px;
        font-family: 'Vazirmatn', sans-serif; font-size: 13px; z-index: 10000;
        opacity: 0; transition: all 0.3s; backdrop-filter: blur(8px);
    }
    .admin-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .admin-toast-error { border-color: #ff7675; color: #ff7675; }
</style>
</head>
<body>

    <div class="admin-page">
        <div class="admin-page-head">
            <h2 class="admin-page-title">⚙️ پنل مدیریت</h2>
            <a class="admin-back" href="/">← بازگشت به رصدخانه</a>
        </div>
        <p class="admin-page-sub">مدیریت کاربران، اشتراک‌ها و تنظیمات سیستم</p>
        <div id="adminPanel"></div>

        <hr style="border:none;border-top:1px solid var(--line-strong);margin:34px 0;">
        <h2 class="admin-page-title" style="font-size:20px;">🧘 مدیریت یوگا <span style="font-size:12px;color:var(--ink-dim);font-family:Vazirmatn,sans-serif;">تمرین‌ها، مربی‌ها و سطح اشتراک</span></h2>
        <div id="yogaAdminPanel"></div>
    </div>

    <script src="static/audio-manager.js?v=1"></script>
    <script src="static/yoga-data-loader.js?v=1"></script>
    <script src="static/yoga-core.js?v=2"></script>
    <script src="static/yoga-player.js?v=15"></script>
    <script src="static/admin-panel.js?v=1"></script>
    <script src="static/admin-yoga.js?v=8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.YogaCore && window.YogaCore.load) window.YogaCore.load().catch(function () {});
            if (window.AdminPanel) window.AdminPanel.init();
            if (window.YogaAdmin) window.YogaAdmin.init();
        });
    </script>
    <style>
        /* ─── پیش‌نمایش زنده تمرین در پنل ادمین ─── */
        .ay-preview-shell {
            background: rgba(7, 12, 31, 0.97);
            border: 1px solid var(--line-strong);
            border-radius: 18px;
            width: min(680px, 96vw);
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .ay-preview-head {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 12px 16px; border-bottom: 1px solid var(--line);
        }
        .ay-preview-head h3 { margin: 0; font-size: 15px; color: var(--gold-200); }
        .ay-preview-note { font-size: 12px; color: var(--ink-dim); }
        .ay-preview-host { padding: 16px; overflow-y: auto; flex: 1; }
        /* نمایشگر خام فایل XML — خطوط قابل پرش/هایلایت از روی خطاها */
        .ay-xml-line { padding: 0 8px; white-space: pre; min-height: 1.6em; }
        .ay-xml-line:nth-child(odd) { background: rgba(255,255,255,.02); }
        .ay-xml-line:hover { background: rgba(116,185,255,.08); }
        .ay-xml-num {
            display: inline-block; min-width: 34px; margin-right: 8px; text-align: right;
            color: #6b7690; user-select: none; direction: ltr;
        }
        .ay-xml-hit { background: rgba(255,196,87,.3) !important; }
        /* دایره تنفس — نسخه مستقل (در صفحه اصلی از style.css می‌آید) */
        .ay-preview-shell .yoga-circle {
            width: 110px; height: 110px; margin: 0 auto; border-radius: 50%;
            border: 2px solid var(--line-strong);
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 35%, rgba(201,162,39,.14), rgba(7,12,31,.6));
            transition: transform 2.2s ease, border-color 1.2s ease;
        }
        .ay-preview-shell .yoga-circle.inhale { transform: scale(1.06); border-color: var(--gold-400); }
        .ay-preview-shell .yoga-circle.exhale { transform: scale(0.8); border-color: #6fcf97; }
        .ay-preview-shell .yp-img { max-height: 180px; }
        .ay-preview-shell .yp-stage { max-width: 320px; }
    </style>
</body>
</html>
