<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1030" viewBox="0 0 600 1030">
<defs>
<radialGradient id="glow" cx="0.5" cy="0.34" r="0.55">
<stop offset="0" stop-color="#e8b84a" stop-opacity="0.95"/>
<stop offset="0.45" stop-color="#c99a2e" stop-opacity="0.5"/>
<stop offset="1" stop-color="#1a1611" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#221d2b"/>
<stop offset="0.5" stop-color="#181420"/>
<stop offset="1" stop-color="#120e18"/>
</linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f5d67a"/>
<stop offset="0.5" stop-color="#c99a2e"/>
<stop offset="1" stop-color="#8a6a1c"/>
</linearGradient>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#9a9a9a"/>
<stop offset="0.5" stop-color="#e8e8e8"/>
<stop offset="1" stop-color="#8a8a8a"/>
</linearGradient>
<linearGradient id="roots" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e8b84a"/>
<stop offset="1" stop-color="#8a6a1c" stop-opacity="0.2"/>
</linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>

