<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Oracle · چارت تولد حرفه‌ای</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/date-wheel-picker.css">
</head>
<body>

    <!-- ===== Animated Background ===== -->
    <canvas id="bg-canvas"></canvas>

    <!-- ===== Main Container ===== -->
    <div class="container">

        <!-- Header -->
        <header class="main-header">
            <div class="logo">
                <span class="logo-icon">🌌</span>
                <h1>Cosmic Oracle</h1>
            </div>
            <div class="sub">رصدخانه‌ی کیهانی · چارت تولد حرفه‌ای</div>
            <div class="header-actions">
                <button class="btn-action" onclick="navigate('')" style="background:#1e2740;">🏠 خانه</button>
                <button class="btn-action" onclick="navigate('dashboard')" style="background:#1e2740;">📊 داشبورد</button>
                <button class="btn-action primary" id="payBtn">⭐ خرید</button>
                <button class="btn-action" id="shareBtn">📤 اشتراک</button>
                <button class="btn-action" id="saveBtn">💾 ذخیره</button>
                <button class="btn-action" id="printBtn">🖨️ پرینت</button>
            </div>
        </header>

        <!-- Form -->
        <div class="form-card">
            <!-- Tab Navigation -->
            <div class="tab-nav" id="tabNav">
                <button class="tab-btn active" data-tab="birth">
                    <span class="tab-emoji">🔮</span> چارت تولد
                </button>
                <button class="tab-btn" data-tab="synastry">
                    <span class="tab-emoji">💕</span> سیناستری
                </button>
                <button class="tab-btn" data-tab="composite">
                    <span class="tab-emoji">🔗</span> کامپوزیت
                </button>
                <button class="tab-btn" data-tab="transit">
                    <span class="tab-emoji">🌍</span> ترانزیت
                </button>
                <button class="tab-btn" data-tab="solar-return">
                    <span class="tab-emoji">☀️</span> بازگشت خورشیدی
                </button>
                <button class="tab-btn" data-tab="lunar-return">
                    <span class="tab-emoji">🌙</span> بازگشت ماهانه
                </button>
                <button class="tab-btn" data-tab="mizaj">
                    <span class="tab-emoji">🧬</span> مزاج‌شناسی
                </button>
                <button class="tab-btn" data-tab="abjad">
                    <span class="tab-emoji">🔢</span> ابجد
                </button>
                <button class="tab-btn" data-tab="tarot">
                    <span class="tab-emoji">🔮</span> تاروت
                </button>
                <button class="tab-btn" data-tab="numerology">
                    <span class="tab-emoji">🔢</span> عددشناسی
                </button>
                <button class="tab-btn" data-tab="biorhythm">
                    <span class="tab-emoji">🔬</span> بیوریتم
                </button>
                <button class="tab-btn" data-tab="zodiac">
                    <span class="tab-emoji">🐉</span> سال حیوانی
                </button>
                <button class="tab-btn" data-tab="daily-question">
                    <span class="tab-emoji">❓</span> پرسش روزانه
                </button>
                <button class="tab-btn" data-tab="hafez">
                    <span class="tab-emoji">🍃</span> فال حافظ
                </button>
                <button class="tab-btn" data-tab="nasa">
                    <span class="tab-emoji">🌌</span> ناسا
                </button>
            </div>

            <!-- Persistent Location Bar -->
            <div class="location-bar" id="locationBar">
                <span class="location-bar-icon">📍</span>
                <span class="location-bar-text" id="locationBarText">مکان: در حال بارگذاری...</span>
            </div>

            <div class="form-title" id="formTitle">
                🪐 اطلاعات تولد
                <span>دقیق و حرفه‌ای</span>
            </div>

            <!-- Dynamic Form Container -->
            <div id="formContainer"></div>

            <button class="btn-primary" id="calcBtn">🔮 دریافت چارت و تحلیل کامل</button>
            <div id="status"></div>
        </div>

        <!-- Results -->
        <div id="result"></div>

        <!-- Footer -->
        <div class="footer-premium">
            ✨ تمام محاسبات توسط موتور ودیک انجام می‌شود ·
            <a href="#" onclick="alert('قوانین استفاده'); return false;">قوانین</a> ·
            <a href="#" onclick="alert('پشتیبانی: support@cosmic-oracle.com'); return false;">پشتیبانی</a>
        </div>
    </div>

    <!-- ===== TOAST NOTIFICATION ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== YOGA ENGINE OVERLAY ===== -->
    <div class="yoga-overlay" id="yogaOverlay">
        <div class="yoga-circle" id="yogaCircle">
            <span id="yogaPhase">🌬️</span>
        </div>
        <div class="yoga-text" id="yogaText">دم بکش...</div>
        <div class="yoga-controls">
            <button id="yogaToggle">⏸️ توقف</button>
            <label>سرعت: <input type="range" id="yogaSpeed" min="3" max="10" value="4" step="0.5"></label>
            <button id="yogaClose">✖ بستن</button>
        </div>
    </div>

    <!-- ===== MAP MODAL ===== -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>📍 انتخاب مکان روی نقشه</h3>
                <button class="modal-close" id="closeMapModal">✕</button>
            </div>
            <div id="map"></div>
            <div class="modal-footer">
                <button id="confirmLocationBtn" class="btn-action primary" style="padding:10px 30px; font-size:14px;">✅ انتخاب</button>
            </div>
        </div>
    </div>

    <!-- ===== Leaflet JS ===== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="static/mizaj.js?v=4"></script>
    <script src="static/abjad.js?v=4"></script>
    <script src="static/persian-provinces.js"></script>
    <script src="static/date-wheel-picker.js?v=15"></script>
    <script src="static/city-selector.js?v=9"></script>
    <script src="static/liquid-orb.js?v=1"></script>
    <script src="static/spa-router.js?v=1"></script>
    <script src="static/script.js?v=12"></script>
    <script src="static/auth-panel.js?v=2"></script>
</body>
</html>
